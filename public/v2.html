<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>V2 visual teaching lab</title><link rel="stylesheet" href="/v2.css"></head>
<body><main><header><p>EXPLAIN CANVAS / EXPERIMENTAL V2</p><h1>Visual teaching lab</h1><p>Review the manual plant scene, seek through its teaching beats, or load a V2 scene JSON.</p></header><section aria-label="Scene preview"><div id="board"></div><div class="controls"><button id="play" type="button">Play</button><label class="seek">Timeline <input id="seek" type="range" min="0" max="1" step="1" value="0"></label><output id="time">0:00</output><label><input id="cursor" type="checkbox" checked> Pencil</label></div><p id="status" role="status">Loading manual scene…</p></section><section><h2>Scene data</h2><div class="controls"><label>Load JSON <input id="file" type="file" accept=".json,application/json"></label><button id="download" type="button">Download compiled JSON</button></div><pre id="details"></pre></section><footer>V2 is experimental. This manual benchmark uses silent, estimated timing. <a href="/index.html">Open V1</a></footer></main><script type="module" src="/v2-viewer.js"></script></body></html>
