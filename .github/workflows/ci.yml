name: verify

# Strict test-only gate: everything pushed to main or proposed via PR must
# pass the same offline verification developers run locally with
# `pnpm run typecheck:hypothesis && pnpm run test:hypothesis`.
# No deployment, no secrets, no paid providers: all jobs are offline.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: typecheck, tests, gates
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm run typecheck:hypothesis

      - name: Offline suite (build + manifest + node + python)
        run: pnpm run test:hypothesis

      - name: Frozen baselines
        run: pnpm run baseline:verify

      - name: Whitespace check
        run: git diff --check
